{% set name = "symmeplot" %}
{% set python_min = "3.10" %}
{% set version = "0.2.2" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/symmeplot-{{ version }}.tar.gz
  sha256: b6bf722492b4840f8573c77da1c6e1bf1e72405218d2d0cdd0b1d3d7b8105625

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}.*
    - hatchling
    - hatch-vcs
    - pip
  run:
    - python >={{ python_min }}
    - sympy >=1.12
    - numpy

test:
  imports:
    - symmeplot
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}.*

about:
  home: https://github.com/tjstienstra/symmeplot
  summary: SymPy Mechanics Plotter
  description: |
    SymMePlot is a tool to visualize mechanical systems created using the mechanics
    module in SymPy, sympy.physics.mechanics. It utilitizes frontends like matplotlib
    or pyqtgraph to display the systems. SymMePlot is designed to be easy to use and
    flexible enough to handle a wide variety of systems.
  license: MIT
  license_file: LICENSE
  doc_url: https://tjstienstra.github.io/symmeplot/
  dev_url: https://github.com/tjstienstra/symmeplot

extra:
  recipe-maintainers:
    - tjstienstra
